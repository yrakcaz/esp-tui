[lints]
workspace = true

[package]
name = "esp-tui"
version = "0.1.0"
edition = "2021"
description = "ESP32 developer workstation in your terminal. Serial monitor, flash controls, and live system inspector in one TUI."
license = "MIT"
repository = "https://github.com/yrakcaz/esp-tui"
readme = "../README.md"
keywords = ["esp32", "tui", "serial", "embedded", "monitor"]
categories = ["command-line-utilities", "embedded", "development-tools"]

[dependencies]
addr2line     = "0.27"
anyhow        = "1"
clap          = { version = "4", features = ["derive"] }
crossterm     = { version = "0.29" }
dirs          = "5"
esp-agent-msg = { path = "../esp-agent-msg" }
espflash      = { version = "3", default-features = false, features = ["serialport"] }
heapless      = "0.8"
ratatui       = "0.30"
regex         = "1"
serde         = { version = "1", features = ["derive"] }
serialport    = "4"
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml          = "0.8"

[dev-dependencies]
tempfile = "3"
